# Builds AutoClicker.app on a GitHub-hosted Mac, runs the tests there, and
# checks the built app starts. Download the app from the run's Artifacts.
# Pushing a version tag (git tag v1.0.2 && git push origin v1.0.2) also
# publishes the app as a public GitHub Release.
# (Real clicking and hotkeys can't be tested here: macOS only allows them
# after a person grants permission in System Settings.)
name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write  # only used by the last step, to publish a release for v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python has Tk
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Unit tests
        run: |
          set +e
          .venv/bin/python -m unittest -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # As annotations, failures are readable without signing in, unlike the log.
            .venv/bin/python .github/annotate_test_failures.py test-output.txt
          fi
          exit "$status"

      - name: Build AutoClicker.app
        run: bash build_mac.sh

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-mac
          path: dist/AutoClicker-mac.zip
          if-no-files-found: error

      - name: Check the built app starts
        run: |
          export HOME="$(mktemp -d)"  # fresh settings; nothing written to the runner's home
          ./dist/AutoClicker.app/Contents/MacOS/AutoClicker > app-output.txt 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            code=0
            wait "$pid" || code=$?
            cat app-output.txt
            message=$(tail -n 40 app-output.txt | .venv/bin/python -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\n", "%0A"))')
            echo "::error title=AutoClicker exited during startup (code $code)::$message"
            exit 1
          fi
          kill "$pid"

      - name: Publish release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          AutoClicker for macOS, Apple Silicon (M1 or later). Not yet tested by a person on a real Mac; please report what happens.

          Install and open it from Terminal:

          ```
          mkdir -p ~/Applications && curl -fL -o /tmp/AutoClicker-mac.zip https://github.com/mayarakwad/AutoClicker/releases/latest/download/AutoClicker-mac.zip && ditto -x -k /tmp/AutoClicker-mac.zip ~/Applications && open ~/Applications/AutoClicker.app
          ```

          Then allow AutoClicker under System Settings > Privacy & Security > Accessibility and Input Monitoring.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/AutoClicker-mac.zip \
            --title "AutoClicker $GITHUB_REF_NAME" --notes-file release-notes.md
